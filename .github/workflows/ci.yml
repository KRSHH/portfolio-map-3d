name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  map:
    name: Map (validate, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  network:
    name: Registry and Nexus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run registry:check
      # Offline: a pull request never depends on other maps being up.
      - run: node scripts/build-network.mjs --offline --keep-on-error
      - run: npx tsc -p nexus/tsconfig.json
      - run: npx vite build --config nexus/vite.config.ts
